[package]
name = "photonyx-mysql"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
mysql = "28.0.4"
json = "0.12.4"
chrono = "0.4.42"
bindings = { path = "../photonyx/bindings" }
photonyx-models = { path = "../photonyx/models", default-features = false, features = ["ir"] }
photonyx-sql-shared = { path = "../photonyx/sql-shared" }

[dev-dependencies]
photonyx-models = { path = "../photonyx/models", features = ["parse"] }
